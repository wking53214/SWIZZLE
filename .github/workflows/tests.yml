name: tests

# The honesty gate runs on every push. `Tests/test_proofs.py` summons every
# warp and proves its own defect with no scanner involved; if it is green,
# every escape the report claims is an escape from something real.
#
# ghost_tools is checked out beside this repository so the end-to-end tests
# run too. They skip cleanly when it is absent, which is deliberate: SWIZZLE
# has to be testable without dragging the subject of the measurement in.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the other: a cancelled job
      # reports nothing about its own version.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: swizzle

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wking53214/ghost_tools
          path: ghost_tools

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: swizzle
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: swizzle
        run: python -m pytest -q

      - name: Report against ghost_buster
        working-directory: swizzle
        # Never gated on the score: escapes are the finding, not the error,
        # and `swizzle run` exits non-zero only on SWIZZLE's own failures.
        # It runs even when Test fails: a red suite used to skip this step,
        # so the pairing went unexercised for as long as the suite was red.
        if: ${{ !cancelled() }}
        run: |
          if [ -d ../ghost_tools/ghost_buster ]; then
            GHOST_TOOLS=../ghost_tools python -m swizzle run
          else
            echo "no ghost_tools checkout; skipping the report"
          fi
