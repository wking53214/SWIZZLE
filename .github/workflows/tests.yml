name: tests

# The honesty gate runs on every push. `Tests/test_proofs.py` summons every
# warp and proves its own defect with no scanner involved; if it is green,
# every escape the report claims is an escape from something real.
#
# ghost_tools is checked out beside this repository so the end-to-end tests
# run too. They skip cleanly when it is absent, which is deliberate: SWIZZLE
# has to be testable without dragging the subject of the measurement in.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the other: a cancelled job
      # reports nothing about its own version.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: swizzle

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wking53214/ghost_tools
          path: ghost_tools

      # ASSAY's answer key makes Tests/test_assay.py's live tests
      # run, and feeds the ASSAY report below.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wking53214/ASSAY
          path: ASSAY

      # The governor under attack. Optional: the attacks run only when it is here.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: wking53214/WARDEN
          path: WARDEN

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: swizzle
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: swizzle
        run: python -m pytest -q

      - name: Report against ghost_buster
        working-directory: swizzle
        # Never gated on the score: escapes are the finding, not the error,
        # and `swizzle run` exits non-zero only on SWIZZLE's own failures.
        # It runs even when Test fails: a red suite used to skip this step,
        # so the pairing went unexercised for as long as the suite was red.
        if: ${{ !cancelled() }}
        run: |
          if [ -d ../ghost_tools/ghost_buster ]; then
            GHOST_TOOLS=../ghost_tools python -m swizzle run
          else
            echo "no ghost_tools checkout; skipping the report"
          fi

      - name: Report against ASSAY
        working-directory: swizzle
        # Not gated on the score, like the report above. It does fail when
        # the ASSAY pairing itself cannot run (exit 2): an answer key
        # that cannot be proven, or a failure mode with no true name.
        if: ${{ !cancelled() }}
        run: |
          if [ -d ../ghost_tools/ghost_buster ] && [ -d ../ASSAY ]; then
            GHOST_TOOLS=../ghost_tools python -m swizzle assay --assay ../ASSAY
          else
            echo "::warning::ghost_tools or ASSAY checkout missing; ASSAY report did not run"
          fi

      - name: Attack the governor (Warden)
        working-directory: swizzle
        # A report, like the ones above. A violated invariant is Warden's finding,
        # not a SWIZZLE failure, so it does not fail this build; failing to run
        # the attacks at all (exit 2) does.
        if: ${{ !cancelled() }}
        run: |
          if [ -d ../WARDEN/warden ]; then
            python -m swizzle governor --warden ../WARDEN || [ $? -eq 1 ]
          else
            echo "::warning::WARDEN checkout missing; governor attacks did not run"
          fi
