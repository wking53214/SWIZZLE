[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swizzle"
version = "0.4.0"
description = "An adaptive adversarial evaluator for repository-level autonomous modification systems: builds reproducible repository states in which a target is likely to make an incorrect epistemic, diagnostic or mutational decision, and proves independently whether it did"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "William King" }]
keywords = ["adversarial-testing", "adversarial-evaluation", "fuzzing",
            "minimization", "oracles", "static-analysis", "blind-spots",
            "autonomous-agents", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Nothing. The warps are stdlib-only on purpose: a fixture that needs a
# package installed is a fixture that fails for a reason the report cannot
# explain.
dependencies = []

[project.scripts]
swizzle = "swizzle.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["swizzle", "swizzle.warps", "swizzle.lab", "swizzle.lab.oracles", "swizzle.lab.adapters"]

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.ruff]
line-length = 100
