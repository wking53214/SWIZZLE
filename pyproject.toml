[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swizzle"
version = "0.8.5"
description = "An adaptive adversarial evaluator for repository-level autonomous modification systems: builds reproducible repository states in which a target is likely to make an incorrect epistemic, diagnostic or mutational decision, and proves independently whether it did"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["adversarial-testing", "adversarial-evaluation", "fuzzing",
            "minimization", "oracles", "static-analysis", "blind-spots",
            "autonomous-agents", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Nothing. The warps are stdlib-only on purpose: a fixture that needs a
# package installed is a fixture that fails for a reason the report cannot
# explain.
dependencies = []

[project.scripts]
swizzle = "swizzle.cli:main"

[project.optional-dependencies]
# pytest-benchmark provides the `benchmark` fixture that
# Tests/test_integration_end_to_end.py::TestIntegrationPerformance uses.
# ruff and mypy are the static gates CI runs (see [tool.ruff] and [tool.mypy] below); setuptools builds the
# wheel that Tests/test_packaging.py inspects.
# libcst is the transformer swizzle.lab.adapters.pydantic_v2 needs; Tests/test_typing_regressions.py
# (test_the_pydantic_scan_reports_one_mapping_per_file) imports it, and without it that test is skipped,
# so the suite would report a skip on every interpreter. It is pinned to an exact version, like the numpy
# and matplotlib pins in CI, because the test drives libcst's parser and a moving version would make the
# result depend on the day it was installed. 1.9.0 is the newest release; it ships wheels for CPython
# 3.11, 3.12 and 3.13 and has no required dependencies beyond pyyaml and typing-extensions.
dev = ["pytest>=8", "pytest-benchmark", "ruff>=0.6", "mypy>=1.10", "setuptools>=68", "libcst==1.9.0"]
# The CNS gate contract, for swizzle.cns_adapter's ProofGate and AttackGate. Optional: SWIZZLE runs without it.
# Pinned to the v1.9.0 tag, which every repository in the circuit spells the same way (pip treats a tag URL and a
# commit URL as two sources, and CNS's seat_pins check compares the text). The tag peels to da18e411743d4e3b0e783105394d845fb1c16746.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v1.9.0"]  # v1.9.0 = da18e411743d4e3b0e783105394d845fb1c16746

[tool.setuptools]
packages = [
    "swizzle",
    "swizzle.warps",
    "swizzle.lab",
    "swizzle.lab.oracles",
    "swizzle.lab.adapters",
    "swizzle.wizzle",
    "swizzle.governor",
    "swizzle.integration",
    "swizzle.production",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["corpus", "fixtures"]

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings, F: pyflakes, B: bugbear. `I` (import
# order) is left out on purpose: it would reorder hundreds of imports for no
# defect, and the code has no formatter to keep it ordered afterwards.
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# The governor scenarios are data: each one carries a full-sentence hypothesis,
# detail and remedy that the tests and the report print verbatim. Wrapping the
# sentences would change nothing the code does and would make the catalogue
# harder to read, so line length is not enforced for this one file.
"swizzle/governor/scenarios.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["swizzle", "tools"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Optional or sibling dependencies that are not installed with SWIZZLE and ship no
# stubs. Each is imported lazily behind a try/except or inside a subprocess, so a
# missing package is handled at run time, not hidden here:
#   cns          the optional contract package (swizzle[cns]); the adapter raises CnsNotInstalled without it
#   ghost_buster the target under test (a sibling checkout, imported by path)
#   warden       the governor under attack (imported only in a subprocess)
#   libcst       the optional transformer used by the pydantic adapter
#   pydantic     the library the pydantic adapter migrates
[[tool.mypy.overrides]]
module = ["cns", "cns.*", "ghost_buster", "ghost_buster.*", "warden", "warden.*", "libcst", "libcst.*", "pydantic", "pydantic.*"]
ignore_missing_imports = true

# Test modules are not part of the type gate: they live in a directory with no
# package (`Tests/` has no __init__.py, so names collide for mypy), build many
# throwaway fakes and monkeypatch freely. They are checked by running them.
